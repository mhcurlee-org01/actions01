name: Schedule Test

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "30 18 * * *"

  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date
          TZ="America/Chicago" date

  one-pm:
    if: github.event.schedule == '0 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World from 1:00 PM Central"

  one-thirty:
    if: github.event.schedule == '30 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World from 1:30 PM Central"